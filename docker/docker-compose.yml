version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=bancodadosteste
      - DB_USER=root
      - DB_PASS=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLOUDINARY_URL=${CLOUDINARY_URL}
    depends_on:
      - db
      - redis
    networks:
      - lojapontocom-network

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bancodadosteste
    volumes:
      - ../Banco de dados:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    networks:
      - lojapontocom-network

  redis:
    image: redis:alpine
    networks:
      - lojapontocom-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - lojapontocom-network

networks:
  lojapontocom-network:
    driver: bridge

volumes:
  db_data:
